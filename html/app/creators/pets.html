<div class="wrap">
  <div id="header-placeholder"></div>

  <main class="petsPageMain">
    <section class="panel">
      <h1>Your pets</h1>
      <p class="sub">Add and manage the pets that appear on your creator profile.</p>

      <div class="petsGrid">
        <!-- ADD PET -->
        <div class="petsCard">
          <h3 class="petsCardTitle">Add a pet</h3>

          <div class="petsField">
            <div class="petsLabel">Name</div>
            <input class="petsInput" id="fName" />
          </div>

          <div class="petsField">
            <div class="petsLabel">Species</div>
            <input class="petsInput" id="fSpecies" placeholder="Dog / Cat / ..." />
          </div>

          <div class="petsField">
            <div class="petsLabel">Breed</div>
            <input class="petsInput" id="fBreed" placeholder="Mix, Labrador, ..." />
          </div>

          <div class="petsField">
            <div class="petsLabel">Birth date</div>
            <input class="petsInput" id="fBirth" type="date" />
          </div>

          <div class="petsField">
            <div class="petsLabel">Age (years)</div>
            <input class="petsInput" id="fAge" type="number" min="0" step="1" placeholder="2" />
          </div>

          <div class="petsField">
            <div class="petsLabel">Pet photo (upload)</div>
            <input class="petsInputFile" id="fAvatarFile" type="file" accept="image/*" />
          </div>

          <div class="petsField">
            <div class="petsLabel">Bio</div>
            <textarea class="petsTextarea" id="fBio" placeholder="Short bio (optional)"></textarea>
          </div>

          <div class="btnRow">
            <button class="btn" id="addBtn" type="button">Add pet</button>
            <button class="ghost" id="resetBtn" type="button">Reset</button>
          </div>

          <div class="petsHint" id="addHint"></div>
        </div>

        <!-- PET LIST -->
        <div class="petsCard">
          <h3 class="petsCardTitle">Your list</h3>
          <div class="petsHint" id="listHint">Loading…</div>
          <div class="petsList" id="petsList"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
</div>
