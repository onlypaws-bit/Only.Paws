  - /css/styles.css
  - /css/app/post.css
  - /css/app/comments.css

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OnlyPaws — Post</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/app/post.css" />
  <link rel="stylesheet" href="/css/app/comments.css" />
</head>

<body class="postPage singlePostPage">
  <div class="wrap">
    <div id="header-placeholder"></div>

    <main class="postMain">
      <section class="panel">
        <div class="singlePostTop">
          <div class="singlePostLabelRow">
            <div class="pill">Post</div>
          </div>

          <h1 id="pageTitle" class="singlePostTitle">Post</h1>

          <div class="singlePostHeader">
            <a
              id="author"
              class="singlePostAuthor"
              href="/html/app/fans/creator-profile.html?u=creator"
              aria-label="Open creator profile"
            >
              <span class="singlePostAuthorAvatar">
                <img
                  id="authorAvatarImg"
                  src="/assets/images/logo.png"
                  alt="Creator avatar"
                  loading="lazy"
                  decoding="async"
                  referrerpolicy="no-referrer"
                />
              </span>

              <span class="singlePostAuthorMeta">
                <span
                  class="singlePostAuthorUsername"
                  id="authorUsername"
                >@creator</span>
              </span>
            </a>

            <div class="singlePostHeaderRight">
              <span id="createdAt" class="singlePostDate"></span>
            </div>
          </div>
        </div>

        <div class="singlePostMediaWrap is-hidden" id="mediaBox"></div>

        <div class="singlePostCaption is-hidden" id="caption"></div>

        <div class="singlePostActions">
          <button
            class="singlePostLikeBtn"
            id="likeBtn"
            data-like-button
            data-post-id=""
            data-liked="false"
            aria-pressed="false"
            type="button"
          >
            <span id="likeIcon" data-like-icon>🤍</span>
            <span class="likeBtnLabel" data-like-label>Like</span>
            <span
              id="likeCount"
              class="singlePostLikeCount"
              data-like-count-inline
            >0</span>
          </button>

          <button class="singlePostLikeBtn" id="copyLinkBtn" type="button">
            🔗 Share
          </button>
        </div>

        <div class="singlePostHint" id="hintBox">Loading…</div>
        <div class="singlePostError is-hidden" id="errBox"></div>
      </section>

      <section id="commentsMount" class="op-commentsSection panel">
        <div class="op-commentsHeader">
          <h2>Comments</h2>
          <span id="commentsCount" class="op-commentsCount">0</span>
        </div>

        <form id="commentForm" class="op-commentForm">
          <textarea
            id="commentInput"
            rows="3"
            maxlength="300"
            placeholder="Write a comment..."
          ></textarea>

          <div class="op-commentFormBottom">
            <p id="commentHint" class="op-commentHint"></p>
            <button id="commentSubmit" class="op-commentSubmit" type="submit">
              Post
            </button>
          </div>
        </form>

        <p id="commentsError" class="op-commentsError is-hidden"></p>
        <p id="commentsEmpty" class="op-commentsEmpty is-hidden"></p>

        <div id="commentsList" class="op-commentsList"></div>

        <button
          id="commentsLoadMore"
          class="op-commentsLoadMore is-hidden"
          type="button"
        >
          Load more
        </button>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/paths.js"></script>
  <script src="/js/onlypawsClient.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/app/likes.js"></script>
  <script src="/js/app/comments.js"></script>
  <script src="/js/app/post.js"></script>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        if (window.OPPartials?.loadLayout) {
          await window.OPPartials.loadLayout();
        }

        if (window.OPNav?.initNav) {
          await window.OPNav.initNav();
        } else if (window.initNav) {
          await window.initNav();
        }

        if (window.OnlyPawsPost?.initSinglePostPage) {
          await window.OnlyPawsPost.initSinglePostPage();
        }
      } catch (err) {
        console.error("Post page init failed:", err);

        const errBox = document.getElementById("errBox");
        if (errBox) {
          errBox.textContent = err?.message || String(err);
          errBox.classList.remove("is-hidden");
          errBox.classList.remove("isHidden");
        }
      }
    });
  </script>
</body>
</html>
