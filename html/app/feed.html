  JS:
  - https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2
  - /js/paths.js

  - /js/nav.js

  - /js/app/comments.js

  POST CARD ACTIONS (rendered by post.js — .op-postBottom):
  Use these classes so the Comments button matches the Like button styling:

    <div class="op-postBottom">
      <button class="op-likeBtn" type="button" data-post-id="...">
        <span class="op-likeIcon">🤍</span>
        <span class="op-likeCount">0</span>
      </button>
      <button class="op-commentsBtn" type="button" data-post-id="...">
        <span class="op-commentsBtnIcon">💬</span>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OnlyPaws — Feed</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/app/feed.css" />
  <link rel="stylesheet" href="/css/app/post.css" />
  <link rel="stylesheet" href="/css/app/comments.css" />
</head>

<body class="feedPage">
  <div class="wrap">
    <div id="header-placeholder"></div>

    <main class="feedMain">
      <section class="panel">
        <div class="feedHeader">
          <div>
            <h1>Feed</h1>
            <p>Browse creators, discover cute content, and support what you love.</p>
          </div>
        </div>

        <div class="searchRow">
          <input
            id="searchInput"
            class="search"
            type="search"
            placeholder="Search creators (by name or @username)..."
            autocomplete="off"
          />
        </div>

        <div class="subtleLine">
          <span>Want to help keep OnlyPaws running?</span>
          <button id="supportBtn" class="navBtn" type="button">Support OnlyPaws</button>
        </div>

        <div id="supportMsg" class="hint" hidden></div>
        <div id="debug" class="debug" hidden></div>
      </section>

      <section class="panel panelSpaced">
        <div class="pill">Featured creators</div>
        <div class="creatorList" id="creatorList"></div>
        <div class="hint" id="creatorHint">Loading creators…</div>
      </section>

      <section class="panel panelSpaced feedPostsSection">
        <div class="postsHeader">
          <h2>Latest posts</h2>
          <div class="postsHeaderHint">Visible posts (premium appears after purchase)</div>
        </div>

        <div class="posts feedPosts" id="posts"></div>
        <div class="hint" id="postsHint">Loading posts…</div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </div>

  <div id="mediaModal" class="mediaModal" aria-hidden="true">
    <div class="mediaModalInner" role="dialog" aria-modal="true" aria-label="Media preview">
      <button
        id="mediaModalClose"
        class="mediaModalClose"
        type="button"
        aria-label="Close preview"
      >
        ✕
      </button>

      <img id="mediaModalImg" class="isHidden" alt="Preview" />
      <video id="mediaModalVid" class="isHidden" controls playsinline></video>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/paths.js"></script>
  <script src="/js/onlypawsClient.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/support-us.js"></script>
  <script src="/js/app/likes.js"></script>
  <script src="/js/app/comments.js"></script>
  <script src="/js/app/post.js"></script>
  <script src="/js/app/feed.js"></script>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      try {
        if (window.OPFeed?.initFeedPage) {
          await window.OPFeed.initFeedPage();
        } else if (window.OnlyPawsFeed?.initFeedPage) {
          await window.OnlyPawsFeed.initFeedPage();
        }
      } catch (err) {
        console.error("Feed page init failed:", err);
      }
    });
  </script>
</body>
</html>
