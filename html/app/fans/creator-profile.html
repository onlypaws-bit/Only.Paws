<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OnlyPaws — Creator Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/app/post.css" />
  <link rel="stylesheet" href="/css/app/fans/creator-profile.css" />
</head>

<body class="creatorProfilePage">
  <div class="wrap">
    <div id="header-placeholder"></div>

    <main>
      <section class="creatorProfileHero">
        <div class="panel creatorProfileCard">
          <div class="pill">Creator</div>

          <div class="creatorProfileTop">
            <div class="creatorIdentity">
              <div class="creatorAvatar">
                <img
                  id="creatorAvatarImg"
                  src="/assets/images/logo.png"
                  alt="Creator avatar"
                />
              </div>

              <div class="creatorMeta">
                <h1 class="creatorDisplayName" id="creatorName">Creator</h1>
                <p class="creatorUsername" id="creatorHandle">@username</p>
              </div>
            </div>
          </div>

          <p class="creatorBio" id="creatorBio"></p>

          <div class="creatorSocials" id="creatorSocials" hidden>
            <a id="creatorInstagram" class="socialChip" hidden>Instagram</a>
            <a id="creatorTikTok" class="socialChip" hidden>TikTok</a>
          </div>

          <div class="btnRow" id="actionRow">
            <button class="ghost" id="followBtn" type="button">Follow</button>
            <button class="btn" id="premiumBtn" type="button">Subscribe</button>
            <button class="ghost" id="shareProfileBtn" type="button">Share</button>
          </div>

          <div class="hint" id="creatorHint"></div>
        </div>

        <section class="panel creatorPetsPanel">
          <div class="pill">Pets</div>
          <div class="petsList" id="petsList"></div>
          <div class="hint" id="petsHint">Loading…</div>
        </section>
      </section>

      <section class="creatorPostsSection">
        <div class="panel">
          <div class="postsHeader">
            <h2>Posts</h2>
            <div class="hint postsHeaderHint">
              Visible posts (premium appears after purchase)
            </div>
          </div>

          <div class="posts creatorPosts" id="posts"></div>
          <div class="hint" id="postsHint">Loading posts…</div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </div>

  <div class="toast" id="toast"></div>

  <div id="mediaModal" class="mediaModal" aria-hidden="true">
    <div class="mediaModalInner" role="dialog" aria-modal="true" aria-label="Media preview">
      <button
        id="mediaModalClose"
        class="mediaModalClose"
        type="button"
        aria-label="Close preview"
      >
        ✕
      </button>

      <img id="mediaModalImg" class="isHidden" alt="Preview" />
      <video id="mediaModalVid" class="isHidden" controls playsinline></video>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/paths.js"></script>
  <script src="/js/onlypawsClient.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/app/likes.js"></script>
  <script src="/js/app/post.js"></script>
  <script src="/js/app/fans/creator-profile.js"></script>
</body>
</html>
