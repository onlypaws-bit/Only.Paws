<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OnlyPaws — Creator Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/app/post.css" />
  <link rel="stylesheet" href="/css/app/fans/creator-profile.css" />
</head>

<body>
  <div class="wrap">
    <div id="header-placeholder"></div>

    <main class="page creatorProfilePage">
      <div class="creatorProfileWrap">

        <div class="creatorProfileGrid">
          <!-- HERO -->
          <section class="panel creatorHeroPanel">
            <div class="pill">Creator</div>

            <h1 id="creatorName">Creator</h1>

            <div class="heroRow">
              <div class="avatar" id="creatorAvatar">🐾</div>

              <div class="meta">
                <b id="creatorHandle">@username</b>
                <span id="creatorBio"></span>
              </div>
            </div>

            <div class="creatorSocials" id="creatorSocials" hidden>
              <a id="creatorInstagram" class="socialChip" hidden>Instagram</a>
              <a id="creatorTikTok" class="socialChip" hidden>TikTok</a>
            </div>

            <div class="btnRow" id="actionRow">
              <button class="ghost" id="followBtn">Follow</button>
              <button class="btn" id="premiumBtn">Subscribe</button>
              <button class="ghost" id="shareProfileBtn">Share</button>
            </div>

            <div class="hint" id="creatorHint"></div>
          </section>

          <!-- PETS -->
          <section class="panel creatorPetsPanel">
            <div class="pill">Pets</div>
            <div class="petsList" id="petsList"></div>
            <div class="hint" id="petsHint">Loading…</div>
          </section>
        </div>

        <!-- POSTS -->
        <section class="panel creatorPostsPanel">
          <div class="sectionHeader">
            <h2>Posts</h2>
            <div class="hint">
              FREE visible • PREMIUM locked
            </div>
          </div>

          <div class="feed" id="posts"></div>

          <div class="hint" id="postsHint">Loading…</div>
        </section>

      </div>
    </main>

    <div id="footer-placeholder"></div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"></div>

  <!-- MEDIA MODAL (come feed) -->
  <div id="mediaModal" class="mediaModal" aria-hidden="true">
    <div class="mediaModalInner">
      <button id="mediaModalClose" class="mediaModalClose">✕</button>

      <img id="mediaModalImg" class="isHidden" />
      <video id="mediaModalVid" class="isHidden" controls playsinline></video>
    </div>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/paths.js"></script>
  <script src="/js/onlypawsClient.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/app/likes.js"></script>
  <script src="/js/app/post.js"></script>
  <script src="/js/app/fans/creator-profile.js"></script>
</body>
</html>
