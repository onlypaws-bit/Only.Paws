<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OnlyPaws — Creator Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/app/post.css" />
  <link rel="stylesheet" href="/css/app/comments.css" />
  <link rel="stylesheet" href="/css/app/fans/creator-profile.css" />
</head>

<body class="creatorProfilePage">
  <div class="wrap creatorProfileWrap">
    <div id="header-placeholder"></div>

    <main class="creatorProfileMain">
      <section class="creatorProfileGrid" aria-label="Creator profile overview">
        <section class="panel creatorHeroPanel" aria-labelledby="creatorName">
          <div class="pill">Creator</div>

          <div class="heroRow">
            <div class="avatar" id="creatorAvatar">
              <img
                id="creatorAvatarImg"
                src="/assets/images/logo.png"
                alt="Creator avatar"
                loading="eager"
                decoding="async"
              />
            </div>

            <div class="meta">
              <h1 class="creatorDisplayName" id="creatorName">Creator</h1>
              <span id="creatorHandle">@username</span>
            </div>
          </div>

          <p class="creatorBio" id="creatorBio"></p>

          <div class="creatorSocials" id="creatorSocials" hidden aria-label="Creator social links">
            <a id="creatorInstagram" class="socialChip" hidden target="_blank" rel="noopener noreferrer">Instagram</a>
            <a id="creatorTikTok" class="socialChip" hidden target="_blank" rel="noopener noreferrer">TikTok</a>
          </div>

          <div class="btnRow" id="actionRow">
            <button class="ghost" id="followBtn" type="button">Follow</button>
            <button class="btn" id="premiumBtn" type="button">Subscribe</button>
            <button class="ghost" id="shareProfileBtn" type="button">Share</button>
          </div>

          <p class="hint" id="creatorHint" aria-live="polite"></p>
        </section>

        <section class="panel creatorPetsPanel" aria-labelledby="petsTitle">
          <div class="pill">Pets</div>
          <h2 id="petsTitle" class="sr-only">Pets</h2>

          <div class="petsList" id="petsList"></div>
          <p class="hint" id="petsHint" aria-live="polite">Loading…</p>
        </section>
      </section>

      <section class="panel creatorPostsPanel" aria-labelledby="postsTitle">
        <div class="postsHeader">
          <h2 id="postsTitle">Posts</h2>
          <div class="hint postsLegend">FREE is visible • PREMIUM is locked unless subscribed</div>
        </div>

        <div class="posts creatorPosts" id="posts">
          <!-- Example Post -->
          <article class="postCard" data-post-id="POST123">
            <div class="postContent">
              <div class="postHeader">
                <div class="postUser">
                  <div class="postAvatar">
                    <img src="/assets/sample-avatar.jpg" alt="User Avatar">
                  </div>
                  <span class="postUsername">@fluffycat</span>
                </div>
                <div class="postDate">2h ago</div>
              </div>

              <div class="postText">
                Check out my new trick! 🐾
              </div>

              <div class="postMedia">
                <img src="/assets/sample-post.jpg" alt="Post media">
              </div>
            </div>

            <!-- ACTIONS -->
            <div class="postActions">
              <button
                class="btn postLikeBtn"
                id="likeBtn-POST123"
                data-like-button
                data-post-id="POST123"
                data-liked="false"
                aria-pressed="false"
                type="button"
              >
                <span id="likeIcon-POST123" data-like-icon>🤍</span>
                <span class="likeBtnLabel" data-like-label>Like</span>
                <span id="likeCount-POST123" class="singlePostLikeCount" data-like-count-inline>0</span>
              </button>

              <button
                class="btn postCommentsBtn"
                id="commentsBtn-POST123"
                data-post-id="POST123"
                type="button"
              >
                Comments
                <span class="op-commentsCount" id="commentsCount-POST123">0</span>
              </button>

              <button class="btn ghost" id="copyLinkBtn-POST123" type="button">
                Copy link
              </button>

              <a class="btn ghost" id="backBtn-POST123" href="/html/app/fans/creator-profile.html">
                Back
              </a>
            </div>

            <!-- COMMENTS SECTION -->
            <div class="op-commentsSection" data-post-id="POST123">
              <form class="op-commentForm" id="commentForm-POST123">
                <textarea id="commentInput-POST123" placeholder="Write a comment…"></textarea>
                <div class="op-commentFormBottom">
                  <p class="op-commentHint" id="commentHint-POST123"></p>
                  <button type="submit" id="commentSubmit-POST123">Post</button>
                </div>
              </form>

              <div class="op-commentsError" id="commentsError-POST123" hidden></div>
              <div class="op-commentsEmpty" id="commentsEmpty-POST123">No comments yet.</div>

              <div class="op-commentsList" id="commentsList-POST123">
                <!-- JS populates comment cards -->
              </div>

              <button class="op-commentsLoadMore" id="commentsLoadMore-POST123" hidden>Load more</button>
            </div>
          </article>
          <!-- /Example Post -->
        </div>

        <p class="hint" id="postsHint" aria-live="polite">Loading posts…</p>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </div>

  <div class="toast" id="toast" aria-live="polite" aria-atomic="true"></div>

  <div id="mediaModal" class="mediaModal" aria-hidden="true">
    <div
      class="mediaModalInner"
      role="dialog"
      aria-modal="true"
      aria-label="Media preview"
    >
      <button
        id="mediaModalClose"
        class="mediaModalClose"
        type="button"
        aria-label="Close preview"
      >
        ✕
      </button>

      <img id="mediaModalImg" class="isHidden" alt="Preview" />
      <video id="mediaModalVid" class="isHidden" controls playsinline></video>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/paths.js"></script>
  <script src="/js/onlypawsClient.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/app/likes.js"></script>
  <script src="/js/app/comments.js"></script>
  <script src="/js/app/post.js"></script>
  <script src="/js/app/fans/creator-profile.js"></script>
</body>
</html>
