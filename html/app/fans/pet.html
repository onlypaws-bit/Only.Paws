<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OnlyPaws — Pet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/app/fans/pet.css" />
</head>
<body class="petsFanPage">
  <div class="pageShell">
    <div id="header-placeholder"></div>

    <main class="wrap">
      <section class="panel petDetails">
        <div class="petHeader">
          <img class="petAvatar" src="/assets/images/default_pet.png" alt="Pet photo" id="petAvatar" />
          <div class="petInfo">
            <h1 id="petName">Pet Name</h1>
            <p id="petSpeciesBreed">Species / Breed</p>
            <p id="petAge"></p>
          </div>
        </div>

        <div class="petBio">
          <h2>About</h2>
          <p id="petBio"></p>
        </div>

        <div class="petMedia">
          <h2>Gallery</h2>
          <div id="petGallery" class="gallery">Loading gallery…</div>
        </div>

        <div class="petNotes">
          <h2>Special Notes</h2>
          <p id="petHealthNotes"></p>
          <p id="petSpecialMarks"></p>
        </div>

        <div class="petFallbackHint hint" id="petFallbackHint" hidden></div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/paths.js"></script>
  <script src="/js/onlypawsClient.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/app/fans/pet.js"></script>
</body>
</html>
