  OnlyPaws
  File: /html/marketing/email-confirmed.html

  Uses central paths from /js/paths.js

  CSS:
  /css/styles.css
  /css/marketing/layout.css
  /css/marketing/auth.css

  JS:
  /js/paths.js
  /js/onlypawsClient.js
  /js/partials.js
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Email confirmed — OnlyPaws</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/marketing/layout.css" />
  <link rel="stylesheet" href="/css/marketing/auth.css" />
</head>

<body>
  <div class="pageShell">
    <div class="wrap">
      <div id="header-placeholder"></div>

      <main class="hero authLayout">
        <section class="panel" style="max-width:720px;margin:0 auto;text-align:center;">
          <div class="pill">Email confirmed 🐾</div>

          <h1>Welcome to OnlyPaws</h1>

          <p class="sub" style="max-width:560px;margin:0 auto 18px;">
            Your email has been confirmed and your account is ready.
            We’re already walking you in.
          </p>

          <div
            style="
              margin:22px auto 24px;
              max-width:540px;
              padding:18px 20px;
              border:1px solid rgba(255,255,255,.14);
              border-radius:18px;
              background:rgba(255,255,255,.06);
              color:var(--muted);
              line-height:1.6;
            "
          >
            <strong style="color:var(--text);">Leash on. Tail up. Let’s go.</strong><br />
            In a few seconds we’ll walk you over to your profile so you can start exploring OnlyPaws.
          </div>

          <div class="btnRow" style="justify-content:center;">
            <a class="btn" id="goProfileBtn" href="/html/app/profile.html">
              Go to profile
            </a>
          </div>

          <p
            id="redirectNote"
            class="note"
            style="margin-top:18px;text-align:center;"
          >
            Walking you in<span id="redirectDots">...</span>
          </p>
        </section>
      </main>

      <div id="footer-placeholder"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/paths.js"></script>
  <script src="/js/onlypawsClient.js"></script>
  <script src="/js/partials.js"></script>

  <script>
    (function () {
      const PATHS = window.OP_PATHS || {};
      const profileUrl =
        PATHS?.app?.profile ||
        "/html/app/profile.html";

      const btn = document.getElementById("goProfileBtn");
      const dots = document.getElementById("redirectDots");

      if (btn) {
        btn.href = profileUrl;
      }

      let dotCount = 0;
      const dotTimer = setInterval(() => {
        dotCount = (dotCount + 1) % 4;
        if (dots) {
          dots.textContent = ".".repeat(dotCount || 3);
        }
      }, 450);

      setTimeout(() => {
        clearInterval(dotTimer);
        window.location.assign(profileUrl);
      }, 3500);
    })();
  </script>
</body>
</html>
