<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OnlyPaws — Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/marketing/status.css" />
  <link rel="stylesheet" href="/css/marketing/reset-password.css" />
</head>

<body>
  <div class="pageShell">
    <div class="wrap">
      <div class="statusLayout">
        <section class="panel statusCard">
          <div class="statusIcon">🔐</div>

          <h1 class="statusTitle">Reset your password</h1>

          <p class="statusText">
            Enter a new password for your account.
          </p>

          <div class="resetHint" id="hint"></div>

          <div class="resetForm">
            <div class="resetFieldGroup">
              <input
                id="newPass"
                class="resetField"
                type="password"
                placeholder="New password (min 6 chars)"
                autocomplete="new-password"
              />

              <input
                id="newPass2"
                class="resetField"
                type="password"
                placeholder="Repeat new password"
                autocomplete="new-password"
              />
            </div>

            <div class="btnRow resetActions">
              <button class="btn" id="saveBtn" type="button">Update password</button>
              <a class="ghost" id="backToLoginLink" href="/index.html">Back to login</a>
            </div>

            <div class="resetMsg authMsg" id="msg"></div>
            <div class="resetHintText resetHint resetHintStatic" hidden></div>

            <div class="resetTiny">
              If this link is expired, go back and request a new reset email.
            </div>
          </div>
        </section>
      </div>

      <div id="footer-placeholder"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/paths.js"></script>
  <script src="/js/onlypawsClient.js"></script>
  <script src="/js/partials.js"></script>
  <script src="/js/marketing/reset-password.js"></script>
</body>
</html>
