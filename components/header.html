<div class="nav appNav">
  <a id="navHome" class="brand" href="/html/app/feed.html">
    <div class="brandLogo">
      <img src="/assets/images/logo.png" alt="OnlyPaws logo">
    </div>
    <span class="brandText">OnlyPaws</span>
  </a>

  <div class="navRight">
    <div class="pill" id="userPill"></div>
    <a class="navBtn" id="navProfile" hidden>Profile</a>
    <a class="navBtn" id="navDashboard" hidden>Dashboard</a>
  </div>
</div>

<script type="module">
  import { OP } from '/js/onlypawsClient.js'; // o dal tuo client centralizzato

  (async () => {
    const { data: { user } } = await OP.client.auth.getUser();
    if (!user) return;

    // Prendiamo il profilo pubblico per avere role e username
    const { data: profile } = await OP.client
      .from('profiles')
      .select('username, role')
      .eq('id', user.id)
      .single();

    const userPill = document.getElementById("userPill");
    if (userPill && profile?.username) {
      const emoji = profile.role === "creator" ? "🐾" : "💜";
      userPill.textContent = `${emoji} ${profile.username}`;
    }
  })();
</script>
