<div class="nav appNav">
  <a id="navHome" class="brand" href="/html/app/feed.html">
    <div class="brandLogo">
      <img src="/assets/images/logo.png" alt="OnlyPaws logo">
    </div>
    <span class="brandText">OnlyPaws</span>
  </a>

  <div class="navRight">
    <div class="pill" id="userPill"></div>
    <a class="navBtn" id="navProfile" hidden>Profile</a>
    <a class="navBtn" id="navDashboard" hidden>Dashboard</a>
  </div>
</div>

<script>
  // assicurati che OP sia pronto
  if (window.OP && OP.client) {
    OP.client.auth.getUser().then(({ data: { user } }) => {
      if (!user) return;

      OP.client.from('profiles')
        .select('username, role')
        .eq('id', user.id)
        .single()
        .then(({ data: profile }) => {
          if (!profile) return;
          const emoji = profile.role === "creator" ? "🐾" : "💜";
          document.getElementById("userPill").textContent = `${emoji} ${profile.username}`;
        });
    });
  }
</script>
